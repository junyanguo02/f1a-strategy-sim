[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "f1a-strategy-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastf1==3.9.2", "pandas==2.3.3", "pyarrow==26.0.1", "pytest==9.2.0", "requests==2.34.2", "numpy==2.5.5"]

[project.optional-dependencies]
app = ["streamlit==1.67.0", "altair==6.3.0"]
model = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "ml_dtypes==0.7.0",
    "multipledispatch==1.0.0",
    "numpyro==0.22.0",
    "opt_einsum==3.4.0",
    "tqdm==4.70.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "analysis"]
